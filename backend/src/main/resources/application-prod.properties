# Neon daje korisnika i lozinku odvojeno od adrese, pa nema jedne varijable s cijelim URL-om
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Render ide kroz Cloudflare, pa je adresa konekcije uvijek proxy. Cloudflare prepiše CF-Connecting-IP
# na svakom zahtjevu, a X-Forwarded-For samo dopuni, pa bi u njemu lijevi dio birao pozivalac.
slotbook.rate-limit.client-ip-header=CF-Connecting-IP

# Na Renderu je log JSON (ECS), da se može pretraživati po polju. MDC (requestId) ulazi sam.
logging.structured.format.console=ecs

# Brojači su za cijelu aplikaciju, ne za jednu organizaciju, pa ih na produkciji ne vidi niko preko HTTP-a
management.endpoints.web.exposure.include=health
sentry.environment=prod

# Render na besplatnom planu blokira odlazne portove 465 i 587, pa mail ide na 2525 (MAIL_PORT).
# Tamo veza počne nešifrovana, a STARTTLS je pretvori u šifrovanu prije prijave. required znači da
# se bez TLS-a ne šalje ni lozinka ni mail. Ostaje protokol smtp, pa važe i timeouti iz application.properties.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
