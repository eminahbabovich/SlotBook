spring.application.name=slotbook

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}
server.shutdown=graceful

management.endpoints.web.exposure.include=health

# Bez podrazumijevane vrijednosti: bolje da aplikacija ne starta nego da potpisuje poznatim ključem
slotbook.jwt.secret=${JWT_SECRET}

# Bez ovoga ?size=2000 vraća 2000 redova u jednom odgovoru (Spring Data podrazumijevano)
spring.data.web.pageable.max-page-size=100
