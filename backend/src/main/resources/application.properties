spring.application.name=slotbook

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}
server.shutdown=graceful

management.endpoints.web.exposure.include=health
# Readiness pada kad baza ne odgovara, pa Render ne šalje promet novoj instanci bez baze.
# Liveness namjerno ne gleda bazu: restart aplikacije ne popravi Neon koji se budi.
management.endpoint.health.group.readiness.include=readinessState,db

# Bez podrazumijevane vrijednosti: bolje da aplikacija ne starta nego da potpisuje poznatim ključem
slotbook.jwt.secret=${JWT_SECRET}

# Bez ovoga ?size=2000 vraća 2000 redova u jednom odgovoru (Spring Data podrazumijevano)
spring.data.web.pageable.max-page-size=100

# Koliko sati provider ima da potvrdi rezervaciju na ručnoj potvrdi (najkasnije do početka termina)
slotbook.booking.pending-hours=24
# Potvrđena rezervacija se zatvara (COMPLETED) toliko sati poslije kraja, da provider stigne označiti nedolazak
slotbook.booking.complete-after-hours=24
slotbook.booking.reminder-hours=24

# Granica pokušaja po IP adresi. Široka, jer je cijela grupa na fakultetu iza jednog NAT-a.
# Zaglavlje s adresom klijenta je prazno lokalno (čita se adresa konekcije), a na Renderu je CF-Connecting-IP.
slotbook.rate-limit.login-per-minute=20
slotbook.rate-limit.register-per-hour=20
slotbook.rate-limit.client-ip-header=
# Pogrešne lozinke za jedan email: toliko u prozoru od duration zaključa prijavu na duration
slotbook.login-lock.failures=5
slotbook.login-lock.duration=15m

# Email. Lokalno je to Mailpit iz docker-compose, a poslani mailovi se vide na http://localhost:8025.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
# Bez ovoga JavaMail čeka SMTP server beskonačno, a s njim i posao za slanje
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
slotbook.mail.from=${MAIL_FROM:SlotBook <noreply@slotbook.local>}
# Mail starter sam doda SMTP u /actuator/health, pa bez SMTP-a health vrati 503 i Render ne pusti deploy.
# Aplikacija radi i kad mail ne radi: obavijesti čekaju u notifications i šalju se kasnije.
management.health.mail.enabled=false
# Adresa frontenda, za linkove u mailovima (potvrda emaila, kasnije reset lozinke)
slotbook.app-url=${APP_URL:http://localhost:5173}

# Cijena BCrypt-a, oko 100 ms po hashu. Testovi je spuste na 4 (application-default u testovima).
slotbook.bcrypt-strength=10

# Slike resursa: local je folder na disku, s3 je S3-kompatibilno skladište (R2 na produkciji)
slotbook.storage.type=${STORAGE_TYPE:local}
slotbook.storage.local-dir=${STORAGE_LOCAL_DIR:uploads}
# Vanjska granica: Tomcat odbije veći zahtjev prije nego što ga cijelog učita u memoriju.
# Servis provjerava 2 MB i sam, jer MockMvc ove granice ne primjenjuje.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Čitaju se samo kad je tip s3. Bez podrazumijevanih vrijednosti, da s3 bez njih ne starta.
slotbook.storage.s3.endpoint=${S3_ENDPOINT}
slotbook.storage.s3.region=${S3_REGION:auto}
slotbook.storage.s3.bucket=${S3_BUCKET}
slotbook.storage.s3.access-key=${S3_ACCESS_KEY}
slotbook.storage.s3.secret-key=${S3_SECRET_KEY}

# ID zahtjeva (RequestIdFilter) u svakoj liniji lokalnog loga, prije imena klase
logging.pattern.correlation=[%X{requestId:-}] 
