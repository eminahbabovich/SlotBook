# Samo za testove. Kad nijedan profil nije aktivan, Spring učita i application-default, a ovaj fajl
# postoji samo na classpathu testova. Testovi ne šalju mailove sami (inače bi završili u lokalnom
# Mailpitu ili u logu kao greške), nego test za slanje zove NotificationSender direktno.
slotbook.notifications.sending=false
# Svi testovi šalju zahtjeve s 127.0.0.1, pa bi zajedno potrošili granicu pokušaja. Granicu dokazuje
# AuthRateLimitApiTest sa svojim, malim vrijednostima.
slotbook.rate-limit.login-per-minute=100000
slotbook.rate-limit.register-per-hour=100000
slotbook.rate-limit.links-per-minute=100000
slotbook.ai.messages-per-minute=100000
# BCrypt snage 4 traje oko milisekunde umjesto oko 100 ms. VrijemeOdgovoraTest vraća 10.
slotbook.bcrypt-strength=4
