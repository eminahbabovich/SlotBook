name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build i testovi
        run: ./mvnw -B verify

      - name: Pokrivenost testovima
        run: |
          awk -F, 'NR > 1 { missed += $8; covered += $9 }
            END { printf "Pokrivenost linija: %.1f%% (%d od %d)\n", 100 * covered / (missed + covered), covered, missed + covered }' \
            target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: jacoco-izvjestaj
          path: backend/target/site/jacoco

  # Playwright ovdje ne ide: traži backend, bazu i Mailpit, pa ostaje lokalni (npm run e2e)
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Oxlint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  # Samo na pull requestu, jer poredi zavisnosti grane s main. Kod mene to su uglavnom PR-ovi od Dependabota.
  zavisnosti:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  tajne:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # cijela historija, jer tajna obrisana u kasnijem commitu i dalje stoji u starom
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # safe.directory: u kontejneru je drugi korisnik od vlasnika foldera, pa git inače odbije čitati repo
      - name: Gitleaks
        run: |
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --verbose --no-banner /repo
