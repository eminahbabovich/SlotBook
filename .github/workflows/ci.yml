name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build i testovi
        run: ./mvnw -B verify

      - name: Pokrivenost testovima
        run: |
          awk -F, 'NR > 1 { missed += $8; covered += $9 }
            END { printf "Pokrivenost linija: %.1f%% (%d od %d)\n", 100 * covered / (missed + covered), covered, missed + covered }' \
            target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: jacoco-izvjestaj
          path: backend/target/site/jacoco
