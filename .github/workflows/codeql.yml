name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # Jednom sedmično i bez novog koda, jer GitHub dodaje nova pravila
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analiza:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # rezultati idu u Security > Code scanning
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # build-mode none: Java se analizira bez Mavena. GitHub tačnost ocjenjuje "Good", a ručni build "Best".
        # Za ovaj projekat je to dovoljno, jer nemamo Kotlina ni koda koji se generiše pri buildu.
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Više pravila od podrazumijevanih, uz nešto više lažnih uzbuna
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
