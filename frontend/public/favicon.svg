<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Znak SlotBooka (src/tema/Znak.jsx): mjeden žeton s prorezom. SVG u tabu ne čita CSS, pa su
       boje hex iz tabele u docs/DIZAJN.md: --mjed-sjaj, --mjed, --mjed-sjena i --dan-tekst. -->
  <defs>
    <linearGradient id="mjed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dfa6"/>
      <stop offset="0.45" stop-color="#c9a04e"/>
      <stop offset="1" stop-color="#8a6a24"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="15" fill="url(#mjed)"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#8a6a24" stroke-width="1.5"/>
  <rect x="9" y="14" width="14" height="4" rx="2" fill="#151933"/>
