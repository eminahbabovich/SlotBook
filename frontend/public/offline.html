<!doctype html>
<html lang="bs">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Nema mreže · SlotBook</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<!-- Service worker ovu stranicu daje kad navigacija ne dođe do mreže. Nema Reacta ni bundla, pa su
		     boje i veličine prepisane iz src/tokeni.css (docs/DIZAJN.md), a font je kopija iz Fontsourcea
		     u public/offline/, da se učita i bez mreže. -->
		<style>
			@font-face {
				font-family: 'Hanken Grotesk Variable';
				font-style: normal;
				font-weight: 100 900;
				font-display: swap;
				src: url('/offline/hanken-grotesk-latin-ext-wght-normal.woff2') format('woff2-variations');
				unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
			}
			@font-face {
				font-family: 'Hanken Grotesk Variable';
				font-style: normal;
				font-weight: 100 900;
				font-display: swap;
				src: url('/offline/hanken-grotesk-latin-wght-normal.woff2') format('woff2-variations');
				unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
			}
			:root {
				--podloga: #f4f2ee;
				--povrsina: #faf9f7;
				--tekst: #18181b;
				--sporedni: #5c5a63;
				--mjed: #e6a93f;
			}
			:root[data-tema='tamna'] {
				--podloga: #0d0e11;
				--povrsina: #15161a;
				--tekst: #edecef;
				--sporedni: #a1a0aa;
				--mjed: #f0bc5e;
			}
			@media (prefers-color-scheme: dark) {
				:root:not([data-tema='svijetla']) {
					--podloga: #0d0e11;
					--povrsina: #15161a;
					--tekst: #edecef;
					--sporedni: #a1a0aa;
					--mjed: #f0bc5e;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				display: grid;
				place-items: center;
				min-height: 100vh;
				margin: 0;
				padding: 16px;
				font-family: 'Hanken Grotesk Variable', sans-serif;
				font-size: 16px;
				line-height: 1.5;
				color: var(--tekst);
				background: var(--podloga);
			}
			main {
				display: grid;
				gap: 16px;
				justify-items: start;
				width: min(100%, 440px);
				padding: 32px 24px;
				background: var(--povrsina);
				border-radius: 24px;
				box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tekst) 14%, transparent);
			}
			h1 {
				margin: 0;
				font-size: 26px;
				line-height: 1.2;
			}
			p {
				margin: 0;
				color: var(--sporedni);
			}
			button {
				min-height: 44px;
				padding: 0 20px;
				font: inherit;
				font-weight: 700;
				color: #18181b;
				background: var(--mjed);
				border: 0;
				border-radius: 999px;
				cursor: pointer;
			}
			button:focus-visible {
				outline: 3px solid var(--tekst);
				outline-offset: 3px;
			}
			.sitno {
				font-size: 14px;
			}
		</style>
		<script>
			try {
				const tema = localStorage.getItem('slotbook-tema')
				if (tema) document.documentElement.dataset.tema = tema
			} catch {
				// bez localStorage ostaje tema sistema
			}
		</script>
	</head>
	<body>
		<main>
			<svg width="48" height="48" viewBox="0 0 32 32" aria-hidden="true">
				<defs>
					<linearGradient id="mjed" x1="0" y1="0" x2="1" y2="1">
						<stop offset="0" stop-color="#fce6b4" />
						<stop offset="0.45" stop-color="#e6a93f" />
						<stop offset="1" stop-color="#a36f12" />
					</linearGradient>
				</defs>
				<circle cx="16" cy="16" r="15" fill="url(#mjed)" />
				<circle cx="16" cy="16" r="11" fill="none" stroke="#a36f12" stroke-width="1.5" />
				<rect x="9" y="14" width="14" height="4" rx="2" fill="#18181b" />
			</svg>
			<h1>Nema mreže</h1>
			<p>
				SlotBook ne može do servera. Termini se bez veze ne prikazuju, jer bi mogli biti zastarjeli, a rezervacija
				ne bi stigla.
			</p>
			<p class="sitno">Kad se veza vrati, stranica se učita sama.</p>
			<button type="button" onclick="location.reload()">Pokušaj ponovo</button>
		</main>
		<script>
			window.addEventListener('online', () => location.reload())
		</script>
	</body>
</html>
