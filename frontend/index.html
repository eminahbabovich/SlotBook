<!doctype html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/ikone/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d0e11" />
    <meta name="description" content="Rezervacija termina bez preklapanja: čitaonica, konsultacije, sala za trening." />
    <title>SlotBook</title>
    <!-- Kako link izgleda kad se podijeli (LinkedIn, Viber, Slack). Slika je hero iz e2e/og-slika.mjs,
         a adresa mora biti puna, jer je čitač linka ne otvara relativno. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://slot-book-delta.vercel.app/" />
    <meta property="og:title" content="SlotBook: termini za čitaonice, teretane i konsultacije" />
    <meta property="og:description" content="Ljudi sami vide slobodne termine i rezervišu ih s telefona. Isti termin nikad ne dobiju dvoje." />
    <meta property="og:image" content="https://slot-book-delta.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Početna stranica SlotBooka: ploča s terminima za sto u čitaonici i odštampana karta za 10:00" />
    <meta property="og:locale" content="bs_BA" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Tamna je podrazumijevana; svijetla izabrana ručno se postavi prije prvog crtanja, da ekran ne bljesne -->
    <script>
      try {
        var t = localStorage.getItem('slotbook-tema')
        if (t === 'svijetla' || t === 'tamna') document.documentElement.dataset.tema = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
